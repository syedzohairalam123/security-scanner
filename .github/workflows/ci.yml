name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile (catch syntax errors)
        run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*" -not -path "./.git/*")

      - name: Run test suite
        env:
          SECRET_KEY: ci-test-secret
        run: python -m pytest -v
